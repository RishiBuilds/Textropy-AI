<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Textropy AI — Settings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 420px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      color: #e0e7ff;
      padding: 24px;
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    p.sub { font-size: 11px; color: #818cf8; letter-spacing: 0.08em; margin-bottom: 18px; }
    label { display: block; font-size: 12px; color: #a5b4fc; margin-bottom: 6px; font-weight: 500; }
    input {
      width: 100%;
      padding: 10px 12px;
      background: rgba(30, 27, 75, 0.6);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 8px;
      color: #e0e7ff;
      font-size: 13px;
      margin-bottom: 14px;
      outline: none;
    }
    input:focus { border-color: #6366f1; }
    .hint { font-size: 11px; color: #64748b; margin-top: -10px; margin-bottom: 14px; }
    button {
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none; border-radius: 8px; color: #fff;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    #status { margin-top: 10px; font-size: 12px; color: #34d399; min-height: 16px; }
  </style>
</head>
<body>
  <h1>Textropy AI</h1>
  <p class="sub">EXTENSION SETTINGS</p>

  <label for="apiBase">API Base URL</label>
  <input type="text" id="apiBase" placeholder="http://localhost:8000">
  <div class="hint">Where your FastAPI backend is reachable (local, Docker, or a remote VPS).</div>

  <label for="apiKey">API Key (optional)</label>
  <input type="password" id="apiKey" placeholder="Only if TEXTROPY_API_KEY is set on the server">
  <div class="hint">Sent as the X-API-Key header when the server has authentication enabled.</div>

  <button id="saveBtn">Save Settings</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
