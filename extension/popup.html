<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Textropy AI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 380px;
      min-height: 200px;
      max-height: 560px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      color: #e0e7ff;
      overflow-y: auto;
    }

    .header {
      padding: 16px 20px;
      text-align: center;
      border-bottom: 1px solid rgba(139, 92, 246, 0.2);
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      font-size: 11px;
      color: #6366f1;
      letter-spacing: 0.1em;
      margin-top: 2px;
    }

    .content {
      padding: 16px 20px;
    }

    .api-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 14px;
      padding: 8px 12px;
      background: rgba(30, 27, 75, 0.5);
      border-radius: 8px;
      border: 1px solid rgba(139, 92, 246, 0.15);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
    }

    .status-dot.connected {
      background: #34d399;
      box-shadow: 0 0 6px rgba(52, 211, 153, 0.5);
    }

    .subject-select {
      width: 100%;
      padding: 10px 14px;
      background: rgba(30, 27, 75, 0.6);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 10px;
      color: #e0e7ff;
      font-size: 13px;
      margin-bottom: 12px;
      cursor: pointer;
      appearance: none;
      outline: none;
    }

    .subject-select:focus {
      border-color: #6366f1;
    }

    .subject-select option {
      background: #1e1b4b;
      color: #e0e7ff;
    }

    .capture-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .capture-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
    }

    .capture-btn:active {
      transform: translateY(0);
    }

    .capture-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .result-area {
      margin-top: 14px;
      display: none;
    }

    .result-area.visible {
      display: block;
    }

    .result-label {
      font-size: 11px;
      color: #a5b4fc;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .result-text {
      background: rgba(15, 12, 41, 0.6);
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 12px;
      line-height: 1.6;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      color: #c4b5fd;
    }

    .copy-btn {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 8px;
      color: #a5b4fc;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .copy-btn:hover {
      background: rgba(99, 102, 241, 0.25);
    }

    .math-block { margin: 8px 0; overflow-x: auto; color: #e0e7ff; }
    .result-text .katex { color: #e0e7ff; font-size: 13px; }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-msg {
      margin-top: 10px;
      padding: 10px 14px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      color: #fca5a5;
      font-size: 12px;
      display: none;
    }

    .error-msg.visible {
      display: block;
    }

    .footer {
      padding: 10px 20px;
      text-align: center;
      font-size: 10px;
      color: #4b5563;
      border-top: 1px solid rgba(139, 92, 246, 0.1);
    }

    .open-dashboard {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 16px;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 6px;
      color: #818cf8;
      font-size: 11px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .open-dashboard:hover {
      background: rgba(99, 102, 241, 0.2);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Textropy AI</h1>
    <p>INTELLIGENT OCR ENGINE</p>
  </div>

  <div class="content">
    <div class="api-status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Checking API...</span>
    </div>

    <select class="subject-select" id="subjectSelect">
      <option value="Auto-detect">Auto-detect</option>
      <option value="Physics">Physics</option>
      <option value="Calculus">Calculus</option>
      <option value="Linear Algebra">Linear Algebra</option>
      <option value="Chemistry">Chemistry</option>
      <option value="Statistics">Statistics</option>
      <option value="Computer Science">Computer Science</option>
      <option value="Other">Other</option>
    </select>

    <button class="capture-btn" id="captureBtn">
      <span id="btnIcon">&#128247;</span>
      <span id="btnText">Capture & Extract</span>
    </button>

    <div class="error-msg" id="errorMsg"></div>

    <div class="result-area" id="resultArea">
      <div class="result-label">Extracted Text</div>
      <div class="result-text" id="resultText"></div>
      <button class="copy-btn" id="copyBtn">&#128203; Copy to Clipboard</button>
    </div>
  </div>

  <div class="footer">
    <a class="open-dashboard" id="openDashboard">Open Full Dashboard</a>
    <a class="open-dashboard" id="openSettings" style="margin-left:8px;">&#9881; Settings</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
